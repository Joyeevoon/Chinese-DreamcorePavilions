<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3a2f55">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%23e8a0c0%22/%3E%3Cpath d=%22M8 30C20 30 26 24 32 14 38 24 44 30 56 30L52 34C42 34 36 30 32 24 28 30 22 34 12 34Z%22 fill=%22%233a2f55%22/%3E%3Cpath d=%22M20 36V50M28 36V50M36 36V50M44 36V50%22 stroke=%22%23a8352a%22 stroke-width=%224%22/%3E%3C/svg%3E">
<title>云上宫阙 · 中式梦核天上宫阙</title>
<style>:root{
  --ink:#fff7fb; --ink2:rgba(255,240,248,.72); --line:rgba(255,255,255,.28);
  --glass:rgba(58,44,88,.32); --glass2:rgba(255,220,236,.14); --on:rgba(255,214,232,.92); --onInk:#4a2c55;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2342;
  background:linear-gradient(180deg,#5b5aa6 0%,#c98ab8 42%,#f6b7a6 58%,#d9b3d6 72%,#8b86b8 100%);
  font-family:var(--serif);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;outline:none;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
:where(#ui button){pointer-events:auto;font-family:var(--serif);color:var(--ink);cursor:pointer;border:0;background:none}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
  box-shadow:0 6px 24px rgba(40,20,60,.18), inset 0 1px 0 rgba(255,255,255,.22)}
.title{position:absolute;left:18px;top:calc(16px + var(--safe-t));padding:10px 16px 9px;border-radius:14px;pointer-events:none}
.title .t1{font-size:21px;letter-spacing:.42em;font-weight:600;text-shadow:0 1px 10px rgba(255,180,220,.55)}
.title .t2{font-size:9.5px;letter-spacing:.24em;color:var(--ink2);margin-top:3px;font-family:Georgia,var(--serif)}
.tr{position:absolute;right:16px;top:calc(16px + var(--safe-t));display:flex;gap:10px;align-items:center}
.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{padding:8px 15px;border-radius:999px;font-size:14px;letter-spacing:.12em;transition:background .35s,color .35s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button:hover{background:var(--glass2)}
#ui .seg button.on{background:var(--on);color:var(--onInk);box-shadow:0 2px 10px rgba(255,170,210,.35)}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.icon svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon:active{transform:scale(.94)}
.bc{position:absolute;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%)}
.ic{width:15px;height:15px;display:inline-block;border-radius:50%;position:relative}
.ic-day{background:radial-gradient(circle,#fff6cf 0 38%,rgba(255,236,170,.0) 40%),conic-gradient(from 0deg,#ffe9a8 0 6%,transparent 6% 12.5%,#ffe9a8 12.5% 18.5%,transparent 18.5% 25%,#ffe9a8 25% 31%,transparent 31% 37.5%,#ffe9a8 37.5% 43.5%,transparent 43.5% 50%,#ffe9a8 50% 56%,transparent 56% 62.5%,#ffe9a8 62.5% 68.5%,transparent 68.5% 75%,#ffe9a8 75% 81%,transparent 81% 87.5%,#ffe9a8 87.5% 93.5%,transparent 93.5%)}
.ic-dusk{background:linear-gradient(180deg,#ffd0a0 0 52%,transparent 52%),radial-gradient(circle at 50% 52%,#ff9e9e 0 45%,transparent 47%);border-radius:50% 50% 2px 2px}
.ic-night{background:radial-gradient(circle at 68% 34%,transparent 0 42%,#eef0ff 44%)}
.ic-rain{background:linear-gradient(115deg,transparent 0 30%,#cfe3ff 30% 38%,transparent 38% 56%,#cfe3ff 56% 64%,transparent 64%);border-radius:3px}
.seg button.on .ic-night{background:radial-gradient(circle at 68% 34%,transparent 0 42%,#5a4a9a 44%)}
.seg button.on .ic-rain{background:linear-gradient(115deg,transparent 0 30%,#5a6aa8 30% 38%,transparent 38% 56%,#5a6aa8 56% 64%,transparent 64%)}
.seg button.on .ic-day{filter:saturate(2) brightness(.85)}
#hint{position:absolute;left:18px;bottom:calc(18px + var(--safe-b));max-width:360px;padding:9px 14px;border-radius:12px;font-size:12px;line-height:1.7;letter-spacing:.06em;color:var(--ink2);pointer-events:none;transition:opacity .5s}
#hint b{color:var(--ink);font-weight:600}
.fpbar{position:absolute;right:16px;top:calc(68px + var(--safe-t));display:none;flex-direction:column;gap:8px;align-items:flex-end}
.fp .fpbar{display:flex}
.pill{padding:8px 14px;border-radius:999px;font-size:13px;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 0 2px rgba(255,255,255,.12)}
#ui .pill[aria-pressed="true"]{background:var(--on);color:var(--onInk)}
.pill[aria-pressed="true"] .dot{background:#ff7fb0;box-shadow:0 0 10px #ff9fd0}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:999px;background:rgba(40,26,60,.45);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;letter-spacing:.12em;opacity:0;transition:opacity .45s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 8px rgba(255,190,230,.9);display:none}
.fp.locked #cross{display:block}
#joy{position:absolute;left:28px;bottom:calc(84px + var(--safe-b));width:118px;height:118px;border-radius:50%;display:none;pointer-events:auto;
  background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.04) 70%);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#joy .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,214,232,.75);box-shadow:0 2px 14px rgba(255,160,210,.5)}
#alt{position:absolute;right:22px;bottom:calc(92px + var(--safe-b));display:none;flex-direction:column;gap:12px}
#alt button{width:52px;height:52px;border-radius:50%;font-size:16px}
.touch.fp #joy{display:block}
.touch.fp #alt{display:flex}
.touch.fp #hint{display:none}

@media (max-width:720px){
  .title{left:12px;top:calc(10px + var(--safe-t));padding:7px 12px 6px;border-radius:12px}
  .title .t1{font-size:16px;letter-spacing:.32em}
  .title .t2{font-size:8px;letter-spacing:.14em}
  .tr{right:10px;top:calc(10px + var(--safe-t));gap:7px}
  .seg button{padding:7px 11px;font-size:13px;letter-spacing:.06em}
  .icon{width:38px;height:38px}
  .bc{bottom:calc(12px + var(--safe-b));width:calc(100% - 20px);justify-content:space-between}
  .bc button{flex:1;justify-content:center;padding:8px 4px;gap:4px}
  #hint{left:10px;right:10px;max-width:none;bottom:calc(66px + var(--safe-b));font-size:11px;padding:7px 11px;text-align:center}
  .fpbar{top:calc(58px + var(--safe-t));right:10px}
  .pill{padding:7px 12px;font-size:12px}
}
@media (max-width:380px){
  .title .t2{display:none}
  .seg button{padding:7px 9px}
}
@media (prefers-reduced-motion:reduce){ .seg button{transition:none} }

/* ============================== loading page */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;overflow:hidden;transition:opacity 1s ease, filter 1s ease}
#loader.out{opacity:0;filter:blur(6px);pointer-events:none}
#loader.gone{display:none}
.lsky{position:absolute;inset:0;background:linear-gradient(180deg,#4b4f9f 0%,#a679b8 38%,#e79db7 58%,#ffc7a0 74%,#e9b6cf 100%)}
.lclouds{position:absolute;inset:0;pointer-events:none}
.lclouds i{position:absolute;left:-40%;width:180%;height:28vh;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,236,244,.75),rgba(255,236,244,0) 66%);filter:blur(6px)}
.lclouds i:nth-child(1){bottom:-10vh;animation:ldrift 26s linear infinite}
.lclouds i:nth-child(2){bottom:4vh;opacity:.7;animation:ldrift 34s linear infinite reverse}
.lclouds i:nth-child(3){bottom:-16vh;opacity:.9;height:34vh;animation:ldrift 40s linear infinite}
.lclouds i:nth-child(4){top:8vh;opacity:.35;height:16vh;animation:ldrift 48s linear infinite reverse}
@keyframes ldrift{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.lcenter{position:relative;text-align:center;color:#fff8fb;transform:translateY(-2vh)}
.lroof{width:min(220px,52vw);height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 4px 18px rgba(120,40,90,.35))}
.lroof .lr{fill:rgba(64,46,92,.82);stroke:#ffe1b0;stroke-width:1.2}
.lroof .lc{stroke:#b03a2e;stroke-width:5;stroke-linecap:round}
.ltitle{font-size:clamp(30px,7vw,46px);letter-spacing:.5em;padding-left:.5em;font-weight:600;text-shadow:0 2px 20px rgba(255,170,210,.8)}
.lsub{font-family:Georgia,var(--serif);font-size:11px;letter-spacing:.5em;padding-left:.5em;opacity:.8;margin-top:6px}
.lbar{width:min(260px,64vw);height:2px;margin:26px auto 10px;background:rgba(255,255,255,.28);border-radius:2px;overflow:hidden}
.lbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd7e8,#fff3d6);transform-origin:left;transform:scaleX(0);box-shadow:0 0 12px #ffe6f0}
.lmsg{font-size:13px;letter-spacing:.12em;opacity:.85;min-height:1.4em;font-variant-numeric:tabular-nums;font-family:Georgia,var(--serif)}
@media (prefers-reduced-motion:reduce){.lclouds i{animation:none}}

/* ============================== rail: reset / music / fog */
.rail{display:flex;gap:8px;align-items:center}
#musicBtn{position:relative}
#musicBtn .disc{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#ffe6f1 0 18%,rgba(255,255,255,.0) 20%),conic-gradient(from 0deg,rgba(255,220,236,.95),rgba(255,180,210,.6),rgba(255,220,236,.95));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
#musicBtn .eq{display:flex;gap:1.6px;align-items:flex-end;height:9px}
#musicBtn .eq i{width:2px;height:3px;background:#7a3a64;border-radius:1px}
#musicBtn.playing .disc{animation:spin 6s linear infinite}
#musicBtn.playing .eq i{animation:eq .9s ease-in-out infinite}
#musicBtn.playing .eq i:nth-child(2){animation-delay:-.3s}#musicBtn.playing .eq i:nth-child(3){animation-delay:-.6s}#musicBtn.playing .eq i:nth-child(4){animation-delay:-.15s}
#musicBtn.waiting::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,214,232,.85);animation:ping 1.6s ease-out infinite}
#musicBtn .mute{display:none}
#musicBtn.muted .disc{display:none}#musicBtn.muted .mute{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{height:3px}50%{height:9px}}
@keyframes ping{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.fogwrap{position:relative}
.pop{position:absolute;right:0;top:52px;width:200px;padding:12px 14px 10px;border-radius:14px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.25s}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.poph{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.15em;margin-bottom:8px}
.poph b{font-weight:500;color:var(--ink2);font-family:Georgia,serif;letter-spacing:0}
.popf{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:4px;letter-spacing:.1em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,214,232,.85));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff4f9;box-shadow:0 0 0 3px rgba(255,170,210,.45),0 2px 8px rgba(80,30,60,.3);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff4f9;box-shadow:0 0 0 3px rgba(255,170,210,.45)}
.exitbtn{display:none;padding:9px 16px;border-radius:999px;font-size:14px;letter-spacing:.15em}
.inside .exitbtn{display:block}
.inside #modeSeg,.inside .fpbar{display:none!important}

/* ============================== navigation */
#nav{position:absolute;left:18px;top:calc(96px + var(--safe-t));width:214px;border-radius:16px;overflow:hidden;pointer-events:auto;transition:width .3s}
#navToggle{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;font-size:14px;letter-spacing:.18em}
#navToggle svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#navToggle .chev{margin-left:auto;transition:transform .3s;width:14px;height:14px}
#nav.open #navToggle .chev{transform:rotate(90deg)}
#navList{max-height:0;overflow:auto;transition:max-height .35s ease;scrollbar-width:none}
#navList::-webkit-scrollbar{display:none}
#nav.open #navList{max-height:min(62vh,520px)}
.navsec{font-size:11px;letter-spacing:.2em;color:var(--ink2);padding:8px 16px 4px;border-top:1px solid rgba(255,255,255,.14)}
.navi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 14px;text-align:left;transition:background .2s}
.navi:hover{background:rgba(255,220,236,.14)}
.navi svg{width:20px;height:20px;flex:none;fill:none;stroke:#ffd9ea;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.navi.see svg{stroke:rgba(255,240,248,.6)}
.navi span{display:flex;flex-direction:column;min-width:0}
.navi b{font-weight:500;font-size:13.5px;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.navi small{font-size:11px;color:var(--ink2);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi em{font-style:normal;font-size:10px;padding:0 5px;border-radius:4px;line-height:16px}
.navi em.ok{background:#c9302a;color:#fff}.navi em.no{background:rgba(255,255,255,.25)}

/* ============================== hotspots */
#hots{position:absolute;inset:0;pointer-events:none}
.hot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;margin:-13px 0 0 -13px;white-space:nowrap;will-change:transform}
.hot i{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle,#fff 0 22%,rgba(255,214,232,.95) 26% 44%,rgba(255,180,214,.25) 48%,rgba(255,180,214,0) 70%);
  box-shadow:0 0 14px rgba(255,180,220,.8);animation:hot 2.2s ease-in-out infinite}
.hot span{font-size:12px;letter-spacing:.14em;padding:3px 9px;border-radius:999px;background:rgba(58,40,80,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.25);opacity:0;transform:translateX(-4px);transition:.25s}
.hot:hover span,.hot:focus span{opacity:1;transform:none}
.touch .hot span{opacity:.92;transform:none;font-size:11px}
@keyframes hot{50%{transform:scale(1.15)}}
.hot.in{display:none;margin:-9px 0 0 -9px}
.hot.in i{width:18px;height:18px;opacity:.85}
.inside .hot{display:none}
.inside .hot.in{display:flex}
.talking .hot,.busy .hot{opacity:0;pointer-events:none}
#doorPrompt{position:absolute;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%);padding:10px 18px;border-radius:999px;font-size:14px;letter-spacing:.18em;display:none;align-items:center;gap:10px}
#doorPrompt kbd{font-family:Georgia,serif;font-size:11px;border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:1px 6px}
.neardoor #doorPrompt{display:flex}
body.entering #doorPrompt{display:flex}
body.entering #hint{opacity:0}
.touch #doorPrompt kbd{display:none}
#bubble{position:absolute;left:50%;top:calc(76px + var(--safe-t));transform:translate(-50%,-8px);padding:9px 18px;border-radius:12px;max-width:min(560px,84vw);text-align:center;
  background:rgba(40,26,60,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;letter-spacing:.14em;opacity:0;transition:.4s;pointer-events:none}
#bubble.show{opacity:1;transform:translate(-50%,0)}
#bubble{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif}

/* ============================== dialogue */
#dlg{position:absolute;left:50%;bottom:calc(78px + var(--safe-b));width:min(620px,calc(100% - 28px));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.35s;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  padding:16px 20px 14px;border-radius:16px;color:#3a2420;
  background:linear-gradient(180deg,rgba(255,250,240,.94),rgba(250,238,220,.94));
  box-shadow:0 12px 40px rgba(60,20,40,.35), inset 0 0 0 1px rgba(170,120,80,.35), inset 0 0 0 5px rgba(255,250,240,.6), inset 0 0 0 6px rgba(170,120,80,.25)}
#dlg.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.dhead{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.2em;font-weight:600;color:#5a2c22}
.dseal{width:26px;height:26px;display:grid;place-items:center;border-radius:5px;background:#b0352a;color:#fff6ea;font-size:15px;letter-spacing:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.dseal:empty{display:none}
#dlgClose{margin-left:auto;font-size:22px;line-height:1;color:#8a5a48!important;width:30px;height:30px;border-radius:50%}
#dlgClose:hover{background:rgba(150,90,60,.12)}
#dlgText{margin:10px 2px 12px;font-size:16px;line-height:1.85;letter-spacing:.06em;white-space:pre-line;min-height:3.6em;cursor:default}
.brush #dlgText{font-size:16px;line-height:1.85}
#dlgOpts{display:flex;flex-wrap:wrap;gap:8px}
#dlgOpts button{padding:7px 16px;border-radius:999px;font-size:14px;font-family:inherit;letter-spacing:.12em;color:#5a2c22!important;background:rgba(255,255,255,.6);border:1px solid rgba(170,110,80,.4)!important;transition:.2s}
#dlgOpts button:hover{background:#b0352a;color:#fff6ea!important;border-color:#b0352a!important}
#dlgInput textarea{width:100%;resize:none;border:1px solid rgba(170,110,80,.45);border-radius:10px;padding:10px 12px;font:17px/1.6 var(--serif);color:#2a1a16;background:rgba(255,255,255,.7);outline:none;user-select:text;-webkit-user-select:text}
.brush #dlgInput textarea{font-size:17px}
#dlgInput textarea:focus{border-color:#b0352a;box-shadow:0 0 0 3px rgba(176,53,42,.15)}
#dlgInput textarea.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.drow{display:flex;gap:8px;margin:8px 0 10px;align-items:center}
.drow input{flex:1;min-width:0;border:1px solid rgba(170,110,80,.45);border-radius:999px;padding:7px 14px;font:14px var(--serif);background:rgba(255,255,255,.7);outline:none;user-select:text;-webkit-user-select:text}
#dlgWrite{flex:none;padding:7px 22px;border-radius:999px;background:#b0352a;color:#fff6ea!important;font-size:15px;letter-spacing:.3em}
.talking #hint,.talking .bc{opacity:0;pointer-events:none}
#hint,.bc{transition:opacity .3s}
#fade{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(circle at 50% 55%,#fff4e4 0%,#f3c9a8 45%,#5a3428 100%)}
#fade.on{opacity:1}

@media (max-width:720px){
  #nav{left:10px;top:calc(74px + var(--safe-t));width:auto;max-width:calc(100% - 20px)}
  #nav:not(.open){width:44px}
  #nav:not(.open) #navToggle{padding:10px 12px}
  #nav:not(.open) #navToggle span{display:none}
  #nav:not(.open) #navToggle .chev{display:none}
  #nav.open{width:min(260px,calc(100% - 20px))}
  .rail{gap:6px}
  .pop{right:2px;max-width:calc(100vw - 24px)}
  #dlg{bottom:calc(64px + var(--safe-b));padding:13px 15px 12px}
  #dlgText{font-size:15px}
  .tr{flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
  .fpbar{top:calc(106px + var(--safe-t))}
}

/* ============================== photo overlay */
#photo{position:absolute;inset:0;display:grid;place-items:center;background:rgba(24,12,32,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:12;pointer-events:auto}
#photo[hidden]{display:none}
.pcard{width:min(560px,calc(100% - 36px));border-radius:18px;padding:14px 16px 16px;color:#fff6f2}
.phead{display:flex;align-items:center;justify-content:space-between;font-size:15px;letter-spacing:.24em;margin-bottom:10px}
.phead button{font-size:22px;line-height:1;width:32px;height:32px;border-radius:50%;color:#fff!important}
.phead button:hover{background:rgba(255,255,255,.16)}
#photoImg{display:block;width:100%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.pnote{margin:10px 2px 12px;font-size:13px;letter-spacing:.12em;color:rgba(255,246,242,.8)}
.pbtns button{width:100%;padding:11px 0;border-radius:999px;background:#b0352a;color:#fff6ea!important;font-size:15px;letter-spacing:.3em}
.pbtns button:hover{background:#c74837}
</style>
</head>

      <button class="icon glass" id="musicBtn" aria-label="背景音乐开关" aria-pressed="true">
        <span class="disc"><span class="eq"><i></i><i></i><i></i><i></i></span></span>
        <svg class="mute" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/><path d="M3.5 3.5l17 17"/></svg>
      </button>
      <div class="fogwrap">
        <button class="icon glass" id="fogBtn" aria-label="雾气强度">

          <div class="popf"><span>晴朗</span><span>烟雨</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="fpbar" id="fpBar">

  </div>

    <button id="navToggle" aria-expanded="false">

// ---------- interior frame
function tickInterior(dt, t, rdt) {
  if (icamTween) {
    icamTween.t = Math.min(1, icamTween.t + rdt / icamTween.dur);
    const e = 1 - Math.pow(1 - icamTween.t, 3);
    icam.position.lerpVectors(icamTween.p0, icamTween.p1, e);
    icontrols.target.lerpVectors(icamTween.t0, icamTween.t1, e); icam.lookAt(icontrols.target);
    if (icamTween.t >= 1) { const cb = icamTween.onDone; icamTween = null; icontrols.update(); cb && cb(); }
  } else { icontrols.update(); clampICam(); }
  isky.position.copy(icam.position);
  for (const L of ILANTERNS) {
    const breeze = 0.012 * Math.sin(t * 0.7 + L.seed);
    L.vx += (-13 * L.ax - 0.55 * L.vx) * dt; L.vz += (-13 * L.az - 0.55 * L.vz) * dt;
    L.ax += L.vx * dt; L.az += L.vz * dt;
    L.node.rotation.set(L.ax + breeze, 0, L.az + breeze * 0.6);
  }
  if (ijelly) { ijelly.position.y = 2.0 + Math.sin(t * 1.2) * 0.08; ijelly.rotation.y = Math.atan2(icam.position.x - ijelly.position.x, icam.position.z - ijelly.position.z) * 0.6;
    const pulse = Math.sin(t * 2 * Math.PI * 0.6); ijelly.scale.set(0.55 * (1 + 0.035 * pulse), 0.55 * (1 - 0.05 * pulse), 0.55 * (1 + 0.035 * pulse)); }
  updatePaper(rdt);
  updateFireworks(dt);
  updateInteriorUI(t);
  if (frame % 120 === 0) renderer.shadowMap.needsUpdate = true;
}

  MUSIC.want = !MUSIC.want; try { localStorage.setItem('celestial.music', MUSIC.want ? '1' : '0'); } catch (e2) {}
  if (MUSIC.want) playMusic(); else pauseMusic(); musicUI();
});
document.addEventListener('visibilitychange', () => { if (!MUSIC.ctx) return; if (document.hidden) MUSIC.ctx.suspend(); else if (MUSIC.want) playMusic(); });
musicUI();

// ---------- plaques on the buildings + brush font
const plaqueGroup = new THREE.Group();
function buildPlaques() {
  for (const p of (DATA.info.plaques || [])) if (p.text) plaqueGroup.add(plaqueMesh(p, false));
  world.add(plaqueGroup);
}
BOOT.font.then(buf => buf && new FontFace('CBrush', buf).load()).then(ff => {
  if (!ff) return; document.fonts.add(ff); document.body.classList.add('brush');
  TEXT_REDRAW.forEach(f => f()); if (!PAPER.anim) drawPaper();
}).catch(e => console.warn('font', e));

function initUI() {
  for (const h of HOT_OUT) if (h.kind === 'act') makeHot(h);
  for (const h of HOT_IN) if (h.id !== 'exit') makeHot(h).classList.add('in');
  refreshNav();
}

// ---------- 自动拍照（三题灯谜答完，烟花绽放时）
function dataURLtoBlob(u) { const [h, d] = u.split(','); const mime = h.match(/:(.*?);/)[1]; const bin = atob(d); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return new Blob([u8], { type: mime }); }
function takePhoto() {
  try {
    composer.render();
    const url = renderer.domElement.toDataURL('image/jpeg', 0.92);
    const ov = $('#photo'), img = $('#photoImg');
    img.src = url; ov.hidden = false;
    STATE.photo = url; STATE.photoShown = true;
  } catch (e) { console.warn('photo', e); }
}
function closePhoto() { const ov = $('#photo'); ov.hidden = true; }
async function savePhoto() {
  const url = STATE.photo; if (!url) return;
  const blob = dataURLtoBlob(url);
  const file = new File([blob], '云上宫阙·烟花.jpg', { type: blob.type });
  const btn = $('#photoSave');
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '云上宫阙' }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  btn.textContent = '已保存 ✓'; setTimeout(() => { btn.textContent = '保存到相册'; }, 1800);
}
$('#photoClose').addEventListener('click', e => { e.stopPropagation(); closePhoto(); });
$('#photoSave').addEventListener('click', e => { e.stopPropagation(); savePhoto(); });
$('#photo').addEventListener('pointerdown', e => { if (e.target.id === 'photo') closePhoto(); });

// ---- 90-boot.js
// ============================================================ boot: parse the Blender scene, build everything, show the first frame
LOADER.set(0.7, '楼阁落成…');
await new Promise(r => setTimeout(r, 30));
const gltf = await new Promise((res, rej) => loader.parse(BOOT.glb, '', res, rej));
processGLB(gltf);
LOADER.set(0.8, '锦鲤入池…');
await new Promise(r => setTimeout(r, 20));
buildKoi();
buildInterior();
buildPlaques();
initUI();
LOADER.set(0.88, '点亮灯火…');
await new Promise(r => setTimeout(r, 20));
afterLoad();
try { renderer.compile(iscene, icam); } catch (e) {}
initMusic();
// hide the loading page after two real frames have been drawn
requestAnimationFrame(() => requestAnimationFrame(() => { LOADER.set(1, '云开'); setTimeout(() => LOADER.done(), 250); }));
if (QA) { window.__qa.__ready = true; }

}
